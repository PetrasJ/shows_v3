security:
    password_hashers:
        App\Entity\User: 'auto'
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            custom_authenticators:
                - App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
            remember_me:
                secret:   '%kernel.secret%'
                lifetime: 31557600 # year
                path:     /
                always_remember_me: true
            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/(%app_locales%)/search, roles: PUBLIC_ACCESS }
        - { path: ^/(%app_locales%)/login$, roles: PUBLIC_ACCESS }
        - { path: ^/(%app_locales%)/register, roles: PUBLIC_ACCESS }
        - { path: ^/(%app_locales%)/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/(%app_locales%)/confirm-email, roles: PUBLIC_ACCESS }
        - { path: ^/(%app_locales%)/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/(%app_locales%)/calendar, roles: PUBLIC_ACCESS }
        - { path: ^/(%app_locales%)/admin/, roles: ROLE_ADMIN }
        - { path: ^/, roles: IS_AUTHENTICATED }
